# fly.toml app configuration file
# Docs: https://fly.io/docs/reference/configuration/

app = 'numprecim-node-api'
primary_region = 'gru'

[build]

[env]
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'continuous'
